name: Publish existing CI artifact (no rebuild)
on:
  workflow_run:
    workflows: ['CI build Windows (one build)']
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: onco-v1.3.0-${{ github.event.workflow_run.head_sha }}
          path: dist
      - name: Confirm version, commit and integrity
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          grep -Fx "commit=$HEAD_SHA" dist/SOURCE_COMMIT.txt
          grep -Fx 'version=1.3.0' dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish release without compiling or resigning
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=v1.3.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite binary artifacts."; exit 0
          fi
          gh release create "$tag" --target "$HEAD_SHA" --title "OnCo AI Solver v1.3.0" \
            --notes 'Installer + browser connection guide + native ChatGPT login + problem-page button recognition. Windows device test remains user responsibility. Unsigned Windows installer may trigger SmartScreen.' \
            dist/OnCo_Setup_v1.3.0.exe dist/OnCo_Extension_v1.3.0.zip dist/OnCoBridge.exe dist/SHA256SUMS.txt dist/SOURCE_COMMIT.txt