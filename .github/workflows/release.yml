name: Publish existing CI artifact (no rebuild)
on:
  workflow_run:
    workflows: ['CI build Windows (one build)']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Windows CI run ID to reuse'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character source commit SHA'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify matching successful CI run and source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA'; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid CI run ID'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" |
            jq -e --arg sha "$SOURCE_SHA" \
              '.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success" and .name == "CI build Windows (one build)"' > /dev/null
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download existing CI artifact (no Windows rebuild)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: onco-v1.3.4-${{ steps.source.outputs.sha }}
          path: dist
      - name: Confirm version, source commit and file hashes
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib
          import os
          base = Path('dist')
          meta_lines = (base/'SOURCE_COMMIT.txt').read_text(encoding='utf-8-sig').splitlines()
          meta = dict(line.split('=', 1) for line in meta_lines if '=' in line)
          expected = {'commit': os.environ['SOURCE_SHA'], 'version': '1.3.4'}
          if meta != expected or len(meta_lines) != len(expected):
              raise SystemExit(f'Build metadata mismatch: {meta!r}')
          names = {'OnCo_Setup_v1.3.4.exe','OnCo_Extension_v1.3.4.zip','OnCo_Runtime_v1.3.4.zip','OnCoBridge.exe'}
          lines = (base/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines()
          verified = set()
          for line in lines:
              if '  ' not in line:
                  raise SystemExit('Malformed SHA256SUMS record')
              digest,name=line.split('  ',1)
              if name not in names or name in verified or len(digest)!=64:
                  raise SystemExit('Unexpected checksum manifest filename or digest')
              path=base/name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest().lower()!=digest.lower():
                  raise SystemExit('Checksum failed: '+name)
              verified.add(name)
              print(name+': OK')
          if verified!=names:
              raise SystemExit('Missing checksum entry')
          print('Source commit/version and all artifacts verified')
          PYVERIFY
      - name: Publish original CI binaries without replacing existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          tag=v1.3.4
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite published artifacts."
            exit 0
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --title 'OnCo AI Solver v1.3.4' \
            --notes 'Switch the ChatGPT path to the official Codex app-server with device-code and browser login, isolated keyring credentials and read-only model inference. Retain Gemini/OpenAI API-key modes and legacy encrypted files; package a pinned Windows Codex runtime, with packaged CI smoke. Real user/Team login remains to be verified after release. Installer unsigned.' \
            dist/OnCo_Setup_v1.3.4.exe dist/OnCo_Extension_v1.3.4.zip dist/OnCo_Runtime_v1.3.4.zip dist/OnCoBridge.exe dist/SHA256SUMS.txt dist/SOURCE_COMMIT.txt
